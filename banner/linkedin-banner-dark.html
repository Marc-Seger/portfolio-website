<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>LinkedIn banner — dark</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  /* Exactly 1584x396 — LinkedIn's banner size. The page IS the banner, so a
     full-page screenshot needs no cropping. */
  html, body { margin:0; padding:0; width:1584px; height:396px; overflow:hidden; }

  .banner{
    position:relative;
    width:1584px; height:396px;
    background:#15120f;                     /* the site's dark theme ink */
    background-image:
      repeating-linear-gradient(45deg,  rgba(238,232,224,0.05) 0 1px, transparent 1px 64px),
      repeating-linear-gradient(-45deg, rgba(238,232,224,0.05) 0 1px, transparent 1px 64px);
    font-family:'Space Grotesk', sans-serif;
    overflow:hidden;
  }

  /* Warm glow bleeding from the left, echoing the site's cursor spotlight.
     Sits under the profile photo on desktop, so it is purely atmospheric. */
  .glow{
    position:absolute; left:-160px; top:50%; transform:translateY(-50%);
    width:900px; height:900px; border-radius:50%;
    background:radial-gradient(circle, rgba(245,147,79,0.16) 0%, rgba(245,147,79,0) 65%);
  }

  .motif{ position:absolute; left:0; top:0; width:760px; height:396px; opacity:0.75; }

  /* Everything that must survive sits in the right 60%, vertically centred. */
  .content{
    position:absolute; right:96px; top:50%; transform:translateY(-50%);
    text-align:right; max-width:820px;
  }
  .eyebrow{
    font-family:'IBM Plex Mono', monospace;
    font-size:15px; letter-spacing:0.16em; text-transform:uppercase;
    color:#f5934f; margin:0 0 20px;
  }
  h1{
    font-size:56px; line-height:1.05; letter-spacing:-0.025em; font-weight:700;
    color:#eee8e0; margin:0 0 22px;
  }
  h1 .accent{ color:#f5934f; }
  .url{
    font-family:'IBM Plex Mono', monospace;
    font-size:18px; color:#9c948a; margin:0;
  }
  .rule{
    width:64px; height:2px; background:#f5934f;
    margin:0 0 0 auto; margin-bottom:22px;
  }
</style>
</head>
<body>

<div class="banner">

  <div class="glow"></div>

  <svg class="motif" viewBox="0 0 760 396" preserveAspectRatio="none" aria-hidden="true">
    <!-- Same abstract series as the light variant: texture, not information. -->
    <defs>
      <linearGradient id="fade" x1="0" y1="0" x2="1" y2="0">
        <stop offset="0%"   stop-color="#f5934f" stop-opacity="0.45"/>
        <stop offset="65%"  stop-color="#f5934f" stop-opacity="0.22"/>
        <stop offset="100%" stop-color="#f5934f" stop-opacity="0"/>
      </linearGradient>
      <linearGradient id="fillFade" x1="0" y1="0" x2="1" y2="0">
        <stop offset="0%"   stop-color="#f5934f" stop-opacity="0.12"/>
        <stop offset="100%" stop-color="#f5934f" stop-opacity="0"/>
      </linearGradient>
    </defs>
    <path d="M0,300 L40,286 L80,296 L120,258 L160,268 L200,224 L240,240 L280,196
             L320,214 L360,168 L400,186 L440,150 L480,166 L520,128 L560,146
             L600,112 L640,128 L680,96 L720,110 L760,84 L760,396 L0,396 Z"
          fill="url(#fillFade)"/>
    <path d="M0,300 L40,286 L80,296 L120,258 L160,268 L200,224 L240,240 L280,196
             L320,214 L360,168 L400,186 L440,150 L480,166 L520,128 L560,146
             L600,112 L640,128 L680,96 L720,110 L760,84"
          fill="none" stroke="url(#fade)" stroke-width="2.5"
          stroke-linejoin="round" stroke-linecap="round"/>
  </svg>

  <div class="content">
    <p class="eyebrow">Product Manager · Data &amp; AI</p>
    <div class="rule"></div>
    <h1>I build the data products<br>I <span class="accent">manage</span>.</h1>
    <p class="url">marcseger.dev</p>
  </div>

</div>

</body>
</html>
