<!-- ============================================================
     LOADER OVERLAY — curtain-reveal loading screen
     Drop the markup right after <body> opens, before real content.
     ============================================================ -->

<div id="loader-overlay">
  <div class="curtain-top"></div>
  <div class="curtain-bottom"></div>
  <div class="loading-layer">
    <div class="initials">MS</div>
    <div class="load-row">
      <div class="bar-track"><div class="bar-fill"></div></div>
      <div class="counter" id="loader-counter">0</div>
    </div>
  </div>
</div>

<style>
  #loader-overlay {
    position: fixed;
    inset: 0;
    z-index: 9999;
    pointer-events: none;
  }
  #loader-overlay .curtain-top,
  #loader-overlay .curtain-bottom {
    position: absolute;
    left: 0;
    width: 100%;
    height: 50%;
    background: #14120f; /* match site's black ink */
    transition: transform 0.7s cubic-bezier(0.83, 0, 0.17, 1);
  }
  #loader-overlay .curtain-top { top: 0; }
  #loader-overlay .curtain-bottom { top: 50%; }
  #loader-overlay.reveal .curtain-top { transform: translateY(-100%); }
  #loader-overlay.reveal .curtain-bottom { transform: translateY(100%); }

  #loader-overlay .loading-layer {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 28px;
    opacity: 1;
    transition: opacity 0.35s ease;
  }
  #loader-overlay.reveal .loading-layer { opacity: 0; }

  #loader-overlay .initials {
    font: 300 32px -apple-system, "Helvetica Neue", Arial, sans-serif;
    letter-spacing: 0.14em;
    color: #f4efe6; /* match site's cream */
  }
  #loader-overlay .load-row {
    display: flex;
    align-items: center;
    gap: 14px;
  }
  #loader-overlay .bar-track {
    width: 180px;
    height: 2px;
    background: rgba(244, 239, 230, 0.2);
    position: relative;
  }
  #loader-overlay .bar-fill {
    position: absolute;
    inset: 0 auto 0 0;
    height: 100%;
    width: 0%;
    background: #f4efe6;
    transition: width 1.4s ease;
  }
  #loader-overlay .counter {
    font: 400 14px -apple-system, "Helvetica Neue", Arial, sans-serif;
    color: rgba(244, 239, 230, 0.65);
    font-variant-numeric: tabular-nums;
    min-width: 24px;
  }
</style>

<script>
  (function () {
    var overlay = document.getElementById('loader-overlay');
    if (!overlay) return;

    // Skip entirely for users who've asked for reduced motion
    if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
      overlay.remove();
      return;
    }

    // Only play once per browser session (not on every route change)
    if (sessionStorage.getItem('loaderPlayed')) {
      overlay.remove();
      return;
    }

    var counter = document.getElementById('loader-counter');
    var fill = overlay.querySelector('.bar-fill');

    requestAnimationFrame(function () {
      fill.style.width = '100%';
    });

    var start = null;
    var duration = 1400;
    function tick(ts) {
      if (!start) start = ts;
      var pct = Math.min(100, Math.round(((ts - start) / duration) * 100));
      counter.textContent = pct;
      if (pct < 100) requestAnimationFrame(tick);
    }
    requestAnimationFrame(tick);

    setTimeout(function () {
      overlay.classList.add('reveal');
      sessionStorage.setItem('loaderPlayed', '1');
      setTimeout(function () {
        overlay.remove();
      }, 800); // matches curtain transition duration
    }, 1600);
  })();
</script>
